plugins {
    id 'com.android.application'
}

android {
    namespace 'es.uvigo.gti.mygamewordsearch'
    compileSdk 37

    defaultConfig {
        applicationId 'es.uvigo.gti.mygamewordsearch'
        minSdk 23
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        encoding = 'UTF-8'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    lint {
        // The legacy code still reads and writes game data through a storage
        // abstraction that looks like an sdcard path; the app-scoped storage
        // migration removes that dependency.
        disable += 'SdCardPath'
    }
}
